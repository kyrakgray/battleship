<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The California Five — rival memory audit</title>
</head>
<body>
<h1>Rival memory audit</h1>
<p>Checks the lifetime of the rival's per-board memory across a New Season,
that <code>chooseRivalSquare</code> is safe when called more or fewer times
than once per turn, and that it never returns an off-board or repeated square —
including from the corners A1 and J10.</p>
<pre id="out">running…</pre>
<script src="../game.js"></script>
<script>
(function () {
  var B = window.CaliforniaFive;
  var results = [];

  function check(name, ok, detail) {
    results.push((ok ? 'PASS' : 'FAIL') + ' — ' + name + (detail ? ': ' + detail : ''));
    return ok;
  }

  function seeded(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function playToEnd(board, rng, max) {
    var days = 0;
    var seen = {};
    var limit = max || 100;
    while (days < limit) {
      var t = B.chooseRivalSquare(board, rng);
      if (!t) return { days: days, error: 'ran out of squares' };
      var key = t.row + ',' + t.col;
      if (seen[key]) return { days: days, error: 'repeat at ' + B.coordLabel(t.row, t.col) };
      if (!B.inBounds(t.row, t.col)) return { days: days, error: 'off board' };
      seen[key] = true;
      var r = B.scout(board, t.row, t.col);
      days++;
      if (!r.legal) return { days: days, error: 'illegal scouting day' };
      if (r.routeComplete) return { days: days };
    }
    return { days: days, error: 'did not terminate' };
  }

  /* 1. Memory lifetime across New Season.
   *
   * ui.js reuses the same board objects between games and only calls
   * clearBoard, so a reused board must behave exactly like a brand new one.
   * Same route + same seed on a recycled board vs. a fresh board must produce
   * an identical scouting day sequence; any carried-over queue or trail marker history would
   * diverge on the first days. */
  function daySequence(board, seed, count) {
    var rng = seeded(seed);
    var seq = [];
    for (var i = 0; i < count; i++) {
      var t = B.chooseRivalSquare(board, rng);
      if (!t) break;
      seq.push(B.coordLabel(t.row, t.col));
      B.scout(board, t.row, t.col);
    }
    return seq.join(' ');
  }

  function routeLayout(board) {
    return Object.keys(board.parks).sort().map(function (id) {
      var s = board.parks[id];
      return id + '@' + s.row + ',' + s.col + ',' + s.orientation;
    }).join('|');
  }

  function memoryLifetimeCheck() {
    var recycled = B.createBoard();
    B.placeRouteRandomly(recycled, seeded(11));
    playToEnd(recycled, seeded(23));

    // New Season: same object, cleared and re-stocked.
    B.clearBoard(recycled);
    B.placeRouteRandomly(recycled, seeded(41));

    var fresh = B.createBoard();
    B.placeRouteRandomly(fresh, seeded(41));

    check('recycled and fresh boards hold the same route',
      routeLayout(recycled) === routeLayout(fresh), routeLayout(fresh));

    var a = daySequence(recycled, 99, 30);
    var b = daySequence(fresh, 99, 30);
    check('rival memory (scouted/openMarkers/queue/stampedSeen) does not survive New Season',
      a === b, a === b ? a.split(' ').slice(0, 6).join(' ') + ' …' : 'recycled ' + a + ' vs fresh ' + b);

    // A mid-game reset while the queue is hot is the harshest case: find a park
    // so neighbors are queued, then clear and confirm the next scouting day is a
    // roaming pick identical to a fresh board's.
    var hot = B.createBoard();
    B.placePark(hot, 'yosemite', 4, 4, B.ORIENTATIONS.HORIZONTAL);
    B.scout(hot, 4, 4);
    B.chooseRivalSquare(hot, seeded(5));
    B.clearBoard(hot);
    B.placePark(hot, 'yosemite', 0, 0, B.ORIENTATIONS.HORIZONTAL);

    var cold = B.createBoard();
    B.placePark(cold, 'yosemite', 0, 0, B.ORIENTATIONS.HORIZONTAL);

    var hotPick = B.chooseRivalSquare(hot, seeded(5));
    var coldPick = B.chooseRivalSquare(cold, seeded(5));
    check('a queue left hot by the previous game is discarded on clearBoard',
      hotPick.row === coldPick.row && hotPick.col === coldPick.col,
      B.coordLabel(hotPick.row, hotPick.col) + ' vs ' + B.coordLabel(coldPick.row, coldPick.col));
  }

  /* 2. Off-cadence calls.
   *
   * recordDays diffs board.days rather than being told what was scouted, so
   * calling the chooser twice without firing must not consume or forget a
   * square, and skipping calls must not lose days that happened meanwhile. */
  function cadenceCheck() {
    var board = B.createBoard();
    B.placePark(board, 'joshua-tree', 3, 3, B.ORIENTATIONS.HORIZONTAL);
    B.scout(board, 3, 3);

    var repeated = [];
    for (var i = 0; i < 5; i++) {
      var t = B.chooseRivalSquare(board, seeded(3));
      repeated.push(B.coordLabel(t.row, t.col));
    }
    var stable = repeated.every(function (label) { return label === repeated[0]; });
    check('calling the chooser repeatedly without firing is idempotent',
      stable, repeated.join(' '));

    // Every extra call must still be a square adjacent to the open trail marker, i.e.
    // the queue was not silently drained by the unscouted calls.
    var next = B.chooseRivalSquare(board, seeded(3));
    var adjacent = Math.abs(next.row - 3) + Math.abs(next.col - 3) === 1;
    check('the queue around an unresolved trail marker survives unscouted calls',
      adjacent, B.coordLabel(next.row, next.col));

    // Fewer calls than days: scout several squares with no chooser call in
    // between, then confirm those days are folded in (no repeat, and the
    // trail marker made meanwhile is pursued).
    var skipped = B.createBoard();
    B.placePark(skipped, 'yosemite', 7, 2, B.ORIENTATIONS.VERTICAL);
    B.scout(skipped, 0, 0);
    B.scout(skipped, 0, 1);
    B.scout(skipped, 7, 2);
    var pursue = B.chooseRivalSquare(skipped, seeded(9));
    check('days taken without a chooser call are folded in and pursued',
      Math.abs(pursue.row - 7) + Math.abs(pursue.col - 2) === 1 &&
        skipped.days[pursue.row][pursue.col] === null,
      B.coordLabel(pursue.row, pursue.col));

    // Interleaving extra calls through a whole game must not break legality
    // or termination.
    var noisy = B.createBoard();
    B.placeRouteRandomly(noisy, seeded(77));
    var rng = seeded(78);
    var seen = {};
    var days = 0;
    var problem = null;
    while (days < 100) {
      B.chooseRivalSquare(noisy, rng);
      B.chooseRivalSquare(noisy, rng);
      var square = B.chooseRivalSquare(noisy, rng);
      if (!square) { problem = 'ran out of squares'; break; }
      var key = square.row + ',' + square.col;
      if (seen[key]) { problem = 'repeat at ' + B.coordLabel(square.row, square.col); break; }
      seen[key] = true;
      var result = B.scout(noisy, square.row, square.col);
      days++;
      if (!result.legal) { problem = 'illegal scouting day'; break; }
      if (result.routeComplete) break;
    }
    check('three chooser calls per scouting day still finishes a legal game',
      !problem && B.isRouteComplete(noisy), problem || days + ' days');
  }

  /* 3. Legality, including corner trail markers. */
  function legalityCheck() {
    var games = 1000;
    var failures = [];
    for (var i = 0; i < games; i++) {
      var board = B.createBoard();
      B.placeRouteRandomly(board, seeded(i + 500));
      var game = playToEnd(board, seeded(i + 9000));
      if (game.error) failures.push('game ' + (i + 1) + ': ' + game.error);
    }
    check(games + ' games: no off-board scouting day, no repeat, every game terminates',
      failures.length === 0, failures.slice(0, 3).join(' / '));

    // Corners: seed a trail marker in each corner so follow mode has to clip its
    // neighbor queue against two edges, then drain the whole board.
    [[0, 0], [9, 9], [0, 9], [9, 0]].forEach(function (corner) {
      var board = B.createBoard();
      B.placePark(board, 'sequoia', corner[0], corner[1] === 9 ? 8 : 0,
        B.ORIENTATIONS.HORIZONTAL);
      B.scout(board, corner[0], corner[1]);

      var rng = seeded(corner[0] * 10 + corner[1] + 1);
      var problem = null;
      for (var n = 0; n < 99; n++) {
        var t = B.chooseRivalSquare(board, rng);
        if (!t) { problem = 'ran out of squares after ' + n; break; }
        if (!B.inBounds(t.row, t.col)) { problem = 'off board ' + t.row + ',' + t.col; break; }
        if (board.days[t.row][t.col] !== null) {
          problem = 'repeat at ' + B.coordLabel(t.row, t.col);
          break;
        }
        B.scout(board, t.row, t.col);
      }
      var remaining = B.unscoutedSquares(board).length;
      check('corner ' + B.coordLabel(corner[0], corner[1]) +
        ': drains the board with no off-board or repeat scouting day',
        !problem && remaining === 0, problem || remaining + ' squares left');
    });

    // A full board must yield null rather than an illegal square.
    var full = B.createBoard();
    B.placeRouteRandomly(full, seeded(4));
    for (var r = 0; r < 10; r++) {
      for (var c = 0; c < 10; c++) B.scout(full, r, c);
    }
    check('returns null when every square has been scouted',
      B.chooseRivalSquare(full, seeded(4)) === null);
  }

  memoryLifetimeCheck();
  cadenceCheck();
  legalityCheck();

  var failed = results.filter(function (line) { return line.indexOf('FAIL') === 0; });
  results.push(failed.length ? failed.length + ' CHECK(S) FAILED' : 'ALL AUDIT CHECKS PASSED');
  document.getElementById('out').textContent = results.join('\n');
})();
</script>
</body>
</html>
