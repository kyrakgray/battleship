<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The California Five — UI smoke run</title>
</head>
<body>
<pre id="out">running…</pre>
<iframe id="frame" src="../index.html" width="1200" height="900"></iframe>
<script>
/*
 * Drives the real page in an iframe: opens the intro, draws a random route,
 * seals and trades, then plays a full season of scouting days, checking the
 * season clock, passports and reset along the way.
 */
(function () {
  var lines = [];
  var failures = 0;

  function check(label, ok, detail) {
    if (!ok) failures++;
    lines.push((ok ? 'PASS' : 'FAIL') + ' — ' + label + (detail ? ' :: ' + detail : ''));
    document.getElementById('out').textContent = lines.join('\n');
  }

  function finish() {
    lines.push(failures === 0 ? 'UI SMOKE RUN PASSED' : failures + ' UI CHECK(S) FAILED');
    document.getElementById('out').textContent = lines.join('\n');
  }

  var frame = document.getElementById('frame');
  frame.addEventListener('load', function () {
    var w = frame.contentWindow;
    var d = frame.contentDocument;
    var errors = [];
    w.addEventListener('error', function (e) { errors.push(String(e.message)); });

    var $ = function (id) { return d.getElementById(id); };

    // Sound cues are recorded rather than played, so the run stays silent
    // and every cue can be asserted on.
    var cues = [];
    var spoken = [];
    var audio = w.CaliforniaFiveAudio;
    var voiceLines = audio.LINES;
    audio.effect = function (name, detail) {
      cues.push(detail ? name + ':' + detail : name);
    };
    audio.say = function (key) { spoken.push(key); };
    audio.sayResult = function (won, days) {
      spoken.push((won ? 'result-win' : 'result-loss') + ':' + days);
    };
    var prepared = [];
    audio.prepareResult = function (won, days) {
      prepared.push((won ? 'result-win' : 'result-loss') + ':' + days);
    };

    check('page title is the theme title', d.title === 'The California Five', d.title);
    check('the title window opens ahead of the story',
      !$('title-window').classList.contains('hidden') &&
      $('intro').classList.contains('hidden'));
    check('the title window names the game',
      /The California Five/.test($('title-heading').textContent));
    check('the title window carries both sound settings',
      /Sound Effects/.test($('btn-sound-effects').textContent) &&
      /Voiceover/.test($('btn-voiceover').textContent));
    check('both sound settings start on',
      $('sound-effects-label').textContent === 'On' &&
      $('voiceover-label').textContent === 'On');

    $('btn-sound-effects').click();
    check('sound effects can be turned off',
      $('sound-effects-label').textContent === 'Off' &&
      $('btn-sound-effects').getAttribute('aria-pressed') === 'false' &&
      audio.isEffectsOn() === false);
    $('btn-sound-effects').click();
    $('btn-voiceover').click();
    check('the voiceover can be turned off',
      $('voiceover-label').textContent === 'Off' &&
      $('btn-voiceover').getAttribute('aria-pressed') === 'false' &&
      audio.isVoiceOn() === false);
    $('btn-voiceover').click();
    check('both settings come back on',
      audio.isEffectsOn() && audio.isVoiceOn() &&
      $('sound-effects-label').textContent === 'On' &&
      $('voiceover-label').textContent === 'On');

    check('the ranger greets the explorer by name of the Classic',
      voiceLines.welcome === 'Welcome to The California National Park Summer Classic.',
      voiceLines.welcome);
    check('the ranger introduces the briefing',
      voiceLines.briefing ===
        "Before you draw your route, here is a ranger's briefing on how to play.",
      voiceLines.briefing);
    check('the ranger calls the sealed itinerary',
      voiceLines.sealed === 'Signed, sealed, and delivered.', voiceLines.sealed);
    check('the ranger sends the explorer off to draw a route',
      /draw your route/.test(voiceLines.planning || ''), voiceLines.planning);
    check('the ranger opens the season with the winter coming',
      /Game on/.test(voiceLines['game-on'] || '') &&
      /El Nino winter/.test(voiceLines['game-on'] || ''), voiceLines['game-on']);
    check('the ranger calls a last park left for each explorer',
      /one park left/.test(voiceLines['last-park-you'] || '') &&
      /one more park left/.test(voiceLines['last-park-rival'] || ''));
    check('the ranger reads the result around the day count',
      /^You won! You found all the California Five parks before your rival in$/
        .test(voiceLines['result-win'] || '') &&
      /^Your rival won\. They found all the California Five parks first in$/
        .test(voiceLines['result-loss'] || ''),
      voiceLines['result-win'] + ' / ' + voiceLines['result-loss']);
    check('the read-out offers a review of the race or a new season',
      /^days\. Now you may review your winning race, or play a new season/
        .test(voiceLines['result-win-end'] || '') &&
      /^days\. Now, you may review this race to see where you went wrong, or play/
        .test(voiceLines['result-loss-end'] || ''),
      voiceLines['result-win-end'] + ' / ' + voiceLines['result-loss-end']);
    function served(path) {
      var request = new w.XMLHttpRequest();
      request.open('HEAD', path, false);
      try { request.send(); } catch (error) { return false; }
      return request.status === 200;
    }
    function weight(path) {
      var request = new w.XMLHttpRequest();
      request.open('HEAD', path, false);
      try { request.send(); } catch (error) { return 0; }
      return Number(request.getResponseHeader('Content-Length') || 0);
    }
    check('the pencil stroke is a short one',
      weight('/sfx/pencil.mp3') > 0 && weight('/sfx/pencil.mp3') < 16000,
      weight('/sfx/pencil.mp3') + ' bytes');
    check('the recorded pencil and the read-out clips are on hand',
      served('/sfx/pencil.mp3') && served('/voice/result-win.mp3') &&
      served('/voice/result-loss-end.mp3') && served('/voice/count-17.mp3') &&
      served('/voice/count-100.mp3'));
    check('every day a season can end on can be read aloud',
      voiceLines['count-17'] === '17' && voiceLines['count-61'] === '61' &&
      voiceLines['count-100'] === '100');
    ['death-valley', 'joshua-tree', 'yosemite', 'kings-canyon', 'sequoia']
      .forEach(function (id) {
        check('the ranger has a line for both explorers finding ' + id,
          /^You found /.test(voiceLines['found-you-' + id] || '') &&
          /^Your rival found /.test(voiceLines['found-rival-' + id] || ''));
      });

    $('btn-title-go').click();
    check('the title window hands off to the story',
      $('title-window').classList.contains('hidden'));
    check('the story window is spoken over',
      spoken.indexOf('welcome') !== -1, spoken.join(','));
    check('intro window is visible on load',
      $('intro') && !$('intro').classList.contains('hidden'));
    check('intro names the Summer Classic',
      /California National Park Summer Classic/.test($('intro').textContent));
    ['3,408,396 acres', '795,156 acres', '761,748 acres', '461,901 acres', '404,063 acres']
      .forEach(function (acres) {
        check('intro lists ' + acres, $('intro').textContent.indexOf(acres) !== -1);
      });

    var arrowhead = $('intro').querySelector('.intro-arrowhead');
    check('intro shows the arrowhead logo',
      !!arrowhead && /nps-arrowhead\.png/.test(arrowhead.getAttribute('src')));
    check('the arrowhead artwork loaded', !!arrowhead && arrowhead.naturalWidth > 0);
    var titleFlag = $('title-window').querySelector('.title-flag');
    check('title card flies the state flag',
      !!titleFlag && titleFlag.naturalWidth > 0 &&
      !$('title-window').querySelector('.intro-badge'),
      titleFlag && titleFlag.getAttribute('src'));
    check('intro copy credits the park passport',
      /stamp in your park passport/.test($('intro').textContent) &&
      /before your rival and the Classic is yours/.test($('intro').textContent));
    ['death-valley', 'joshua-tree', 'yosemite', 'kings-canyon', 'sequoia'].forEach(function (id) {
      check('intro shows the ' + id + ' icon',
        !!$('intro').querySelector('.park-icon use[href="#icon-' + id + '"]'));
      check('sprite defines the ' + id + ' icon', !!d.getElementById('icon-' + id));
    });
    check('sprite defines the dead-end icon', !!d.getElementById('icon-dead-end'));

    check('story window leads with How to Play',
      /How to Play/.test($('btn-intro-how-to').textContent));
    $('btn-intro-how-to').click();
    check('story hands off to the how-to window',
      $('intro').classList.contains('hidden') &&
      !$('how-to').classList.contains('hidden'));
    var ranger = $('how-to').querySelector('.ranger-portrait');
    check('the briefing window is headed by the ranger',
      !!ranger && ranger.naturalWidth > 0 &&
      !$('how-to').querySelector('.intro-badge'),
      ranger && ranger.getAttribute('src'));
    var steps = $('how-to').querySelectorAll('ol > li');
    check('voice scouting is a briefing step of its own',
      steps.length === 6 && /Scout by voice/.test(steps[4].textContent) &&
      /Collect the California Five/.test(steps[5].textContent),
      steps.length + ' steps');
    check('the briefing is spoken over the how-to window',
      spoken.indexOf('briefing') !== -1, spoken.join(','));
    check('how-to window enters the Classic',
      $('btn-how-to-close').textContent === 'Enter the Classic');
    check('how-to window can step back to the story',
      !!$('btn-how-to-back'));
    $('btn-how-to-close').click();
    check('how-to closes on "Enter the Classic"',
      $('how-to').classList.contains('hidden') && $('intro').classList.contains('hidden'));
    check('the route-drawing stage is spoken over',
      spoken.indexOf('planning') !== -1, spoken.join(','));

    $('btn-intro-open').click();
    check('the story reopens during the Classic',
      !$('intro').classList.contains('hidden'));
    $('btn-how-to-open').click();
    check('how to play reopens during the Classic',
      !$('how-to').classList.contains('hidden') && $('intro').classList.contains('hidden'));
    $('btn-how-to-close').click();

    check('five park cards rendered', $('park-list').children.length === 5);
    check('park cards show acreage',
      $('park-list').textContent.indexOf('3,408,396 acres') !== -1);
    check('start is gated until the route is drawn', $('btn-start').disabled);
    check('season clock starts at zero of 100',
      $('days-used').textContent === '0' && $('days-total').textContent === '100' &&
      $('days-left').textContent === '100');
    check('calendar opens on July 4, 2026',
      $('calendar-month').textContent === 'JUL' && $('calendar-day').textContent === '4' &&
      $('calendar-weekday').textContent === 'Saturday' &&
      /OCT 11 2026/.test($('closing-date').textContent));
    check('field notes read as an explorer\'s log',
      /Explorer's Log/.test(d.querySelector('.log-panel').textContent));

    var visible = function (el) {
      return w.getComputedStyle(el).display !== 'none';
    };

    check('route planning is its own stage', d.body.classList.contains('planning'));
    check('route planning hides the explorer\'s log',
      !visible(d.querySelector('.log-panel')));
    check('route planning hides the calendar', !visible($('season-clock')));
    check('route planning shows a single map',
      !visible($('rival-wrap')) && visible($('player-wrap')));
    check('the planning map is drawn as paper',
      w.getComputedStyle($('player-wrap')).backgroundImage !== 'none');
    var mapFlag = $('player-wrap').querySelector('.map-flag');
    check('the planning map carries the state flag',
      visible(mapFlag) && /flag\.svg/.test(mapFlag.getAttribute('src')) &&
      mapFlag.complete && mapFlag.naturalWidth > 0);

    check('a rotate control is on the page for touch explorers',
      visible($('btn-rotate')) && /Across/.test($('btn-rotate').textContent));
    $('btn-rotate').click();
    check('the rotate control turns the park down the map',
      /Down/.test($('btn-rotate').textContent) &&
      $('orientation-label').textContent === 'Down');
    $('btn-rotate').click();
    check('the rotate control turns it back across',
      /Across/.test($('btn-rotate').textContent) &&
      $('orientation-label').textContent === 'Across');

    check('the log and the tracker share one row',
      d.querySelector('.field-row').contains(d.querySelector('.log-panel')) &&
      d.querySelector('.field-row').contains($('tracker')));
    check('the status line and the calendar are one panel',
      $('tracker').contains($('status-bar')) &&
      $('tracker').contains($('season-clock')));
    check('each passport is its own cell of the maps grid',
      d.querySelector('.boards').contains($('player-passport')) &&
      d.querySelector('.boards').contains($('rival-passport')) &&
      $('player-passport').contains($('status-player')) &&
      $('rival-passport').contains($('status-rival')));
    check('New Season sits above the two window links',
      $('btn-new-game').parentNode.contains($('btn-intro-open')) &&
      $('btn-new-game').parentNode.contains($('btn-how-to-open')) &&
      $('btn-new-game').getBoundingClientRect().bottom <=
        $('btn-intro-open').getBoundingClientRect().top + 1);
    check('voice scouting is hidden while the route is being drawn',
      !visible($('voice-bar')));
    check('the season strip carries no second instruction line',
      $('season-controls').querySelectorAll('.hint').length === 0);
    check('passports stay closed until the season starts',
      d.querySelectorAll('.passport-book').length === 2 &&
      !visible(d.querySelector('.passport-book')));
    check('nothing on the page mentions cancellations',
      !/cancel/i.test(d.body.textContent));

    var firstCell = $('player-board').querySelector('.cell');
    firstCell.click();
    check('drawing a park on the map is heard',
      cues.indexOf('draw') !== -1, cues.join(','));
    $('btn-reset').click();

    $('btn-random').click();
    check('random route enables seal & trade', !$('btn-start').disabled);
    $('btn-start').click();

    check('the sealed itinerary is called out',
      spoken.indexOf('sealed') !== -1, spoken.join(','));

    check('sealing the route opens the envelope window',
      !$('seal').classList.contains('hidden'));
    check('the wax seal is lettered around its edge',
      /The California Five/.test($('seal').querySelector('.wax-seal').textContent) &&
      /Summer Classic/.test($('seal').querySelector('.wax-seal').textContent));
    check('the wax seal is imprinted with the state',
      !!$('seal').querySelector('.wax-state[href="#icon-california"]') &&
      !!d.getElementById('icon-california'));
    check('the envelope is drawn back-side up',
      !!$('seal').querySelector('.envelope .envelope-flap'));
    check('the season has not started from the envelope alone',
      d.body.classList.contains('planning'));

    $('btn-seal-go').click();
    check('trading the itineraries starts the season',
      d.body.classList.contains('season') && $('seal').classList.contains('hidden'));
    check('the log and calendar appear once the season starts',
      visible(d.querySelector('.log-panel')) && visible($('season-clock')) &&
      visible($('rival-wrap')));

    check('the season opens with the ranger calling it on',
      spoken.indexOf('game-on') !== -1, spoken.join(','));
    check('the voice control wears an ear',
      !!$('btn-voice-scout').querySelector('use[href="#icon-ear"]') &&
      !!d.getElementById('icon-ear'));
    check('the voice control has its own colour',
      w.getComputedStyle($('btn-voice-scout')).backgroundColor !==
        w.getComputedStyle($('btn-new-game')).backgroundColor);
    if (w.innerWidth > 820) {
      var voiceBox = $('voice-bar').getBoundingClientRect();
      var trackerBox = $('tracker').getBoundingClientRect();
      check('voice scouting lines up above the calendar tracker',
        Math.abs(voiceBox.left - trackerBox.left) < 2 &&
        voiceBox.bottom <= trackerBox.top + 1,
        voiceBox.left + ' vs ' + trackerBox.left);
    }
    // Squeeze the page to a phone width: everything goes single file, and
    // the voice control has to land directly above the rival's map.
    frame.width = '420';
    var narrowVoice = $('voice-bar').getBoundingClientRect();
    var narrowRival = $('rival-wrap').getBoundingClientRect();
    var narrowTracker = $('tracker').getBoundingClientRect();
    check('single file puts voice scouting right above the rival map',
      narrowVoice.top >= narrowTracker.bottom - 1 &&
      narrowVoice.bottom <= narrowRival.top + 1,
      'voice ' + Math.round(narrowVoice.top) + '-' + Math.round(narrowVoice.bottom) +
        ', tracker ends ' + Math.round(narrowTracker.bottom) +
        ', rival map at ' + Math.round(narrowRival.top));
    var narrowBoard = $('rival-board').getBoundingClientRect();
    function centre(box) { return box.left + box.width / 2; }
    var narrowButton = $('btn-voice-scout').getBoundingClientRect();
    check('single file centres voice scouting over the board below it',
      Math.abs(centre(narrowButton) - centre(narrowBoard)) < 3,
      Math.round(centre(narrowButton)) + ' vs ' + Math.round(centre(narrowBoard)));
    var barCentre = centre($('btn-new-game').closest('.controls')
      .getBoundingClientRect());
    check('single file centres New Season over the two window links',
      Math.abs(centre($('btn-new-game').getBoundingClientRect()) - barCentre) < 3 &&
      Math.abs(centre($('btn-intro-open').parentNode.getBoundingClientRect()) -
        barCentre) < 3,
      Math.round(centre($('btn-new-game').getBoundingClientRect())) + ' vs ' +
        Math.round(barCentre));
    frame.width = '1200';

    check('rival map is live after sealing',
      !$('rival-board').classList.contains('disabled'));
    if (w.innerWidth >= 760) {
      check('the route drawn for you sits left of the route you drew',
        $('rival-wrap').getBoundingClientRect().left <
          $('player-wrap').getBoundingClientRect().left);
    }
    check('passport slots rendered for both explorers',
      $('status-player').children.length === 5 && $('status-rival').children.length === 5);
    check('passport shows acreage',
      $('status-rival').textContent.indexOf('404,063 acres') !== -1);
    check('no park stamped before any scouting day',
      $('status-rival').querySelectorAll('.stamp-mark').length === 0);

    /*
     * Scouting by voice. A stand-in recogniser stands where the browser's
     * would, so the run can hear a command without a microphone.
     */
    var speech = w.CaliforniaFiveVoice;
    [
      ['scout A4', 0, 3],
      ['a four', 0, 3],
      ['alpha four', 0, 3],
      ['okay ranger scout j ten', 9, 9],
      ['scout B7', 1, 6],
      ['Scout   c 10 ', 2, 9]
    ].forEach(function (sample) {
      var square = speech.parseSquare(sample[0]);
      check('“' + sample[0] + '” reads as ' + w.CaliforniaFive.coordLabel(sample[1], sample[2]),
        !!square && square.row === sample[1] && square.col === sample[2],
        JSON.stringify(square));
    });
    ['', 'scout the desert', 'k four', 'a eleven', 'four']
      .forEach(function (heard) {
        check('“' + heard + '” is not a square', speech.parseSquare(heard) === null);
      });

    var mic = null;
    function FakeRecognition() { mic = this; }
    FakeRecognition.prototype.start = function () { this.open = true; };
    FakeRecognition.prototype.stop = function () {
      this.open = false;
      if (this.onend) this.onend();
    };
    FakeRecognition.prototype.hear = function (text) {
      this.onresult({ resultIndex: 0, results: [[{ transcript: text }]] });
    };
    w.SpeechRecognition = FakeRecognition;

    check('the voice scouting control starts off',
      $('voice-scout-label').textContent === 'Off' &&
      $('btn-voice-scout').getAttribute('aria-pressed') === 'false');
    $('btn-voice-scout').click();
    check('turning it on opens the microphone',
      speech.isListening() && $('voice-scout-label').textContent === 'Listening' &&
      $('btn-voice-scout').getAttribute('aria-pressed') === 'true');

    mic.hear('scout the far side of the pass');
    check('an unclear command asks for it again and spends no day',
      /Say that again/.test($('voice-heard').textContent) &&
      $('days-used').textContent === '0', $('voice-heard').textContent);

    mic.hear('scout A4');
    var spokenCell = $('rival-board').querySelectorAll('.cell')[3];
    check('a heard square spends the scouting day it names',
      $('days-used').textContent === '1' &&
      (spokenCell.classList.contains('marker') ||
       spokenCell.classList.contains('dead-end')),
      spokenCell.className);
    check('the heard square is read back',
      /A4/.test($('voice-heard').textContent), $('voice-heard').textContent);
    check('calendar holds the date until the rival scouts',
      $('calendar-day').textContent === '4', $('calendar-day').textContent);

    var logAfterVoice = $('log').children.length;
    mic.hear('scout A4');
    check('saying a square again spends nothing',
      $('log').children.length === logAfterVoice &&
      /already scouted A4|not your scouting day/.test($('voice-heard').textContent),
      $('voice-heard').textContent);

    mic.onerror({ error: 'not-allowed' });
    check('a blocked microphone says so and stops listening',
      !speech.isListening() && /microphone is blocked/.test($('voice-heard').textContent) &&
      $('voice-scout-label').textContent === 'Off', $('voice-heard').textContent);

    var cells = $('rival-board').querySelectorAll('.cell');
    var order = [];
    for (var i = 0; i < cells.length; i++) order.push(cells[i]);
    var next = 0;
    var sawMarkerIcon = false;
    var sawDeadEndIcon = false;
    var checkedCalendarTurn = false;
    var checkedFirstClick = false;

    function clickNext() {
      // Spend a day, then let the rival's turn resolve before the next click.
      while (next < order.length &&
             (order[next].classList.contains('marker') ||
              order[next].classList.contains('dead-end'))) next++;
      if (next >= order.length) return step(true);

      var before = Number($('days-used').textContent);
      order[next].click();
      var after = Number($('days-used').textContent);
      if (!checkedFirstClick) {
        checkedFirstClick = true;
        check('a scouting day advances the season clock', after === before + 1, before + ' -> ' + after);
        check('the square is marked', order[next].classList.contains('marker') ||
          order[next].classList.contains('dead-end'));
        var repeatBefore = $('log').children.length;
        order[next].click();
        check('re-scouting a square does nothing', $('log').children.length === repeatBefore);
      }
      if (order[next].classList.contains('dead-end') && !sawDeadEndIcon) {
        sawDeadEndIcon = true;
        check('a dead end draws the forest-road barricade',
          order[next].dataset.icon === 'icon-dead-end', order[next].dataset.icon);
      }
      if (order[next].classList.contains('marker') && !sawMarkerIcon) {
        sawMarkerIcon = true;
        check('a trail marker draws its park icon',
          /^icon-/.test(order[next].dataset.icon || '') &&
          order[next].dataset.icon !== 'icon-dead-end', order[next].dataset.icon);
        var parkId = order[next].dataset.icon.replace('icon-', '');
        var park = w.CaliforniaFive.PARKS.filter(function (p) {
          return p.id === parkId;
        })[0];
        var painted = order[next].style.backgroundColor;
        check('a found square is painted in its park colour',
          painted !== '' && painted !== 'rgb(216, 98, 44)',
          park.color + ' rendered as ' + painted);
      }
      w.setTimeout(step, 80);
    }

    var sawFlash = false;

    function waitForResult(tries) {
      if (!$('game-over').classList.contains('hidden') || tries > 60) return report();
      w.setTimeout(function () { waitForResult(tries + 1); }, 100);
    }

    function step(forced) {
      var over = $('phase-label').textContent.indexOf('Season over') !== -1;
      if (over && !sawFlash) {
        sawFlash = true;
        check('the result is called over the maps before the season card',
          !$('winner-flash').classList.contains('hidden') &&
          /You won!|Your rival won/.test($('winner-flash').textContent) &&
          $('game-over').classList.contains('hidden'),
          $('winner-flash').textContent);
      }
      if (over || forced) return waitForResult(0);
      if ($('phase-label').textContent.indexOf('rival is out scouting') !== -1) {
        return w.setTimeout(step, 80);
      }
      if (!checkedCalendarTurn && Number($('days-used').textContent) === 1) {
        checkedCalendarTurn = true;
        check('calendar turns over once both explorers have scouted',
          $('calendar-day').textContent === '5' && $('calendar-month').textContent === 'JUL',
          $('calendar-month').textContent + ' ' + $('calendar-day').textContent);
      }
      clickNext();
    }

    function report() {
      var over = $('phase-label').textContent.indexOf('Season over') !== -1;
      check('a full season reaches a result', over, $('phase-label').textContent);
      var msg = $('message').textContent;
      check('result names the California Five or the rival',
        /California Five|rival finished/.test(msg), msg);
      check('the season ends in a result window',
        !$('game-over').classList.contains('hidden'));
      check('the result window names the winner',
        /collected the California Five/.test($('game-over-title').textContent),
        $('game-over-title').textContent);
      var statLabels = Array.prototype.map.call(
        $('game-over-stats').querySelectorAll('th'), function (th) {
          return th.textContent;
        }).join(' | ');
      check('the flash clears once the season card opens',
        $('winner-flash').classList.contains('hidden'));
      check('the result window calls the win or the loss',
        /^You won!$|^You lost$/.test($('game-over-verdict').textContent),
        $('game-over-verdict').textContent);
      check('the season card drops the days-left row',
        !/Days left in the season/.test($('game-over-stats').textContent));
      check('the result window reports both season cards',
        $('game-over-stats').children.length === 5 &&
        /Trail days spent/.test(statLabels) && /Squares found/.test(statLabels) &&
        /Scouting accuracy/.test(statLabels) && /Passport stamps/.test(statLabels) &&
        /Dead ends/.test(statLabels), statLabels);
      check('every season-card row carries a number for each explorer',
        Array.prototype.every.call($('game-over-stats').children, function (row) {
          return row.querySelectorAll('td').length === 2 &&
            /\d/.test(row.children[1].textContent) &&
            /\d/.test(row.children[2].textContent);
        }));
      $('btn-over-close').click();
      check('the result window closes onto the maps',
        $('game-over').classList.contains('hidden'));
      var stampedSide = /California Five/.test(msg) ? 'status-rival' : 'status-player';
      var stamps = $(stampedSide).querySelectorAll('.stamp-mark');
      check('winning passport holds five stamps', stamps.length === 5);
      check('each stamp carries its park and the date it was completed',
        Array.prototype.every.call(stamps, function (stamp) {
          return /^[A-Z]{3} \d{2} \d{4}$/.test(
            stamp.querySelector('.stamp-mark-date').textContent) &&
            stamp.querySelector('.stamp-mark-park').textContent.length > 0;
        }),
        stamps.length ? stamps[0].textContent : '');
      check('reveal button only after a loss',
        $('btn-reveal').classList.contains('hidden') === /California Five/.test(msg));
      check('a dead end sounds different from a trail marker',
        cues.indexOf('deadEnd') !== -1 &&
        cues.some(function (cue) { return /^marker:/.test(cue); }),
        cues.slice(0, 12).join(','));
      check('each park rings its own trail-marker cue',
        cues.filter(function (cue) { return /^marker:/.test(cue); })
          .filter(function (cue, i, all) { return all.indexOf(cue) === i; })
          .length > 1);
      check('a stamped park brings the stamp down',
        cues.indexOf('stamp') !== -1);
      check('the last park left is called out',
        spoken.indexOf('last-park-you') !== -1 ||
        spoken.indexOf('last-park-rival') !== -1, spoken.join(','));
      var readOut = spoken.filter(function (key) {
        return /^result-(win|loss):/.test(key);
      })[0];
      var daysRow = $('game-over-stats').children[0];
      var winnerDays = daysRow.children[/California Five/.test(msg) ? 1 : 2].textContent;
      check('the read-out is built while the result is still being called',
        prepared.length > 0 && prepared[0] === readOut, prepared.join(','));
      check('the ranger reads the result with the winner\'s day count',
        readOut === (/California Five/.test(msg) ? 'result-win' : 'result-loss') +
          ':' + winnerDays, readOut + ' vs ' + winnerDays);
      check('a stamped park is called by name',
        spoken.some(function (key) { return /^found-(you|rival)-/.test(key); }),
        spoken.join(','));
      check('both square icons were drawn during the season',
        sawMarkerIcon && sawDeadEndIcon, 'marker: ' + sawMarkerIcon + ', dead end: ' + sawDeadEndIcon);
      check('field notes kept the whole season', $('log').children.length > 10,
        $('log').children.length + ' entries');
      check('season clock counted the days scouted',
        Number($('days-used').textContent) + Number($('days-left').textContent) === 100,
        $('days-used').textContent + ' + ' + $('days-left').textContent);

      $('btn-new-game').click();
      check('new season clears the field notes', $('log').children.length === 0);
      check('new season resets the clock',
        $('days-used').textContent === '0' && $('days-left').textContent === '100');
      check('new season clears both maps',
        d.querySelectorAll('.cell.marker, .cell.dead-end').length === 0);
      check('new season clears the passports',
        d.querySelectorAll('.stamp-mark').length === 0);
      check('new season turns the calendar back to July 4',
        $('calendar-month').textContent === 'JUL' && $('calendar-day').textContent === '4');
      check('new season re-gates seal & trade', $('btn-start').disabled);
      check('new season returns to route planning',
        d.body.classList.contains('planning') &&
        $('game-over').classList.contains('hidden'));
      check('the empty log shows an empty state, not a bare rule',
        $('log').classList.contains('empty'));
      check('no uncaught page errors', errors.length === 0, errors.join(' | '));
      finish();
    }

    step();
  });
})();
</script>
</body>
</html>
