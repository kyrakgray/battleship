<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The California Five — targeting benchmark</title>
</head>
<body>
<h1>Targeting benchmark</h1>
<p>1,000 games per strategy against randomly drawn routes. Reports the average
number of scouting days needed to stamp all five parks, and asserts no square is ever
scouted twice and every game terminates.</p>
<pre id="out">running…</pre>
<script src="../game.js"></script>
<script>
(function () {
  var B = window.CaliforniaFive;
  var GAMES = 1000;
  var MAX_DAYS = 100;

  /** Deterministic RNG so both strategies face the same routes and dice. */
  function seeded(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function runGame(chooseSquare, rng) {
    var board = B.createBoard();
    B.placeRouteRandomly(board, rng);

    var seen = {};
    var days = 0;

    while (days < MAX_DAYS) {
      var square = chooseSquare(board, rng);
      if (!square) return { error: 'ran out of squares after ' + days + ' days' };

      var key = square.row + ',' + square.col;
      if (seen[key]) return { error: 'repeat scouting day at ' + B.coordLabel(square.row, square.col) };
      seen[key] = true;

      var result = B.scout(board, square.row, square.col);
      days++;
      if (!result.legal) return { error: 'illegal scouting day at ' + B.coordLabel(square.row, square.col) };
      if (result.routeComplete) return { days: days };
    }
    return { error: 'route not completed within ' + MAX_DAYS + ' days' };
  }

  function benchmark(label, chooseSquare) {
    var total = 0;
    var worst = 0;
    var best = MAX_DAYS;
    var errors = [];

    for (var i = 0; i < GAMES; i++) {
      var game = runGame(chooseSquare, seeded(i + 1));
      if (game.error) {
        errors.push('game ' + (i + 1) + ': ' + game.error);
        continue;
      }
      total += game.days;
      worst = Math.max(worst, game.days);
      best = Math.min(best, game.days);
    }

    var completed = GAMES - errors.length;
    return {
      label: label,
      average: total / Math.max(completed, 1),
      best: best,
      worst: worst,
      completed: completed,
      errors: errors
    };
  }

  var random = benchmark('random roaming', B.chooseRandomSquare);
  var follow = benchmark('roam-and-follow', B.chooseRivalSquare);

  function describe(r) {
    return r.label + ': average ' + r.average.toFixed(1) + ' days ' +
      '(best ' + r.best + ', worst ' + r.worst + ', ' +
      r.completed + '/' + GAMES + ' games completed' +
      (r.errors.length ? ', ' + r.errors.length + ' FAILURES' : '') + ')';
  }

  /**
   * Adjacent parks: stamping one must not abandon the marker on the other.
   * Sequoia at A1–A2, Yosemite at B1–B3; the rival marks B1, then stamps
   * Sequoia, and must keep working around B1.
   */
  function adjacentParkCheck() {
    var board = B.createBoard();
    B.placePark(board, 'sequoia', 0, 0, B.ORIENTATIONS.HORIZONTAL);
    B.placePark(board, 'yosemite', 1, 0, B.ORIENTATIONS.HORIZONTAL);

    B.scout(board, 1, 0);
    B.scout(board, 0, 0);
    var stamp = B.scout(board, 0, 1);
    if (!stamp.stamped || stamp.parkId !== 'sequoia') return 'setup failed: Sequoia not stamped';

    var square = B.chooseRivalSquare(board, seeded(7));
    var pursuesYosemite = (square.row === 1 && square.col === 1) ||
      (square.row === 2 && square.col === 0);
    return pursuesYosemite
      ? 'adjacent-park check: kept scouting Yosemite at ' + B.coordLabel(square.row, square.col)
      : 'ADJACENT-PARK CHECK FAILED: went to ' + B.coordLabel(square.row, square.col);
  }

  var adjacency = adjacentParkCheck();
  var lines = [describe(random), describe(follow), adjacency];
  var improvement = (1 - follow.average / random.average) * 100;
  lines.push('improvement: ' + improvement.toFixed(1) + '% fewer days');
  lines.push('no repeat days, all games terminated: ' +
    (random.errors.length === 0 && follow.errors.length === 0 ? 'yes' : 'NO'));

  var ok = adjacency.indexOf('FAILED') === -1 && adjacency.indexOf('setup failed') === -1 &&
    random.errors.length === 0 && follow.errors.length === 0 &&
    random.completed === GAMES && follow.completed === GAMES &&
    follow.average < random.average * 0.85;
  lines.push(ok ? 'BENCHMARK PASSED' : 'BENCHMARK FAILED');
  if (random.errors.length) lines.push(random.errors.slice(0, 5).join('\n'));
  if (follow.errors.length) lines.push(follow.errors.slice(0, 5).join('\n'));

  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body>
</html>
