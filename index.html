<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleship</title>
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
<header>
  <h1>Battleship</h1>
  <p class="tagline" id="phase-label">Ship placement phase</p>
</header>

<main>
  <section class="controls">
    <div class="placement-controls" id="placement-controls">
      <div class="fleet" id="fleet-list" role="listbox" aria-label="Fleet"></div>
      <div class="buttons">
        <button id="btn-random" type="button">Place Randomly</button>
        <button id="btn-reset" type="button">Reset Placement</button>
        <button id="btn-start" type="button" disabled>Start Game</button>
      </div>
      <p class="hint">Select a ship, press <kbd>R</kbd> to rotate, click a square to place it.</p>
      <p class="orientation">Orientation: <strong id="orientation-label">Horizontal</strong></p>
    </div>
    <div class="battle-controls hidden" id="battle-controls">
      <p class="hint">Click a square on Enemy Waters to fire.</p>
      <div class="buttons">
        <button id="btn-reveal" class="hidden" type="button">Reveal Enemy Ship Locations</button>
        <button id="btn-new-game" type="button">New Game</button>
      </div>
    </div>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </section>

  <section class="panel log-panel">
    <h3>Message log</h3>
    <ol class="log" id="log" aria-live="polite"></ol>
  </section>

  <section class="boards">
    <div class="board-wrap">
      <h2>Your Fleet</h2>
      <div class="board" id="player-board"></div>
      <div class="panel status-panel">
        <h3>Fleet status</h3>
        <ul id="status-player"></ul>
      </div>
    </div>
    <div class="board-wrap">
      <h2>Enemy Waters</h2>
      <div class="board disabled" id="enemy-board" aria-disabled="true"></div>
      <div class="panel status-panel">
        <h3>Fleet status</h3>
        <ul id="status-enemy"></ul>
      </div>
    </div>
  </section>
</main>

<script src="game.js?v=8"></script>
<script src="ui.js?v=8"></script>
</body>
</html>
